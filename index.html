<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Piano Composer Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Piano Composer Preview</p>
        <h1 id="songTitle">Untitled Piano Piece</h1>
        <p id="songMeta" class="meta"></p>
      </div>
      <div class="status-pill" id="audioStatus">Tap Play to enable audio</div>
    </header>

    <section class="panel controls">
      <div class="transport">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸ Pause</button>
        <button id="stopBtn">■ Stop</button>
        <button id="restartBtn">↺ Restart</button>
      </div>

      <div class="grid-controls">
        <label>Tempo
          <input id="tempoInput" type="range" min="50" max="110" value="76" />
          <span id="tempoValue">76 BPM</span>
        </label>
        <label>Volume
          <input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.75" />
        </label>
        <label>Speed
          <select id="speedSelect">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
          </select>
        </label>
        <label>Hands
          <select id="handSelect">
            <option value="both">Both hands</option>
            <option value="right">Right hand only</option>
            <option value="left">Left hand only</option>
          </select>
        </label>
        <label class="loop-control"><input id="loopToggle" type="checkbox" /> Loop</label>
      </div>
    </section>

    <section class="panel timeline-panel">
      <div class="time-row"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
      <input id="seekBar" type="range" min="0" max="1000" value="0" />
      <canvas id="pianoRoll" height="180"></canvas>
    </section>

    <section class="panel">
      <div class="legend"><span>Keyboard</span><small>Active notes light up during playback</small></div>
      <div id="pianoKeyboard" class="keyboard" aria-label="Piano keyboard"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
